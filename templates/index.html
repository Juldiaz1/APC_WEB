<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APC Database Interface</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Arlington Physicians' Center Database</h1>
        <p class="subtitle">Host: 127.0.0.1 | Database: apc_database</p>
        
        <!-- Q1: Hospital Expansion -->
        <div class="operation">
            <h2>Q1: Hospital Expansion - General Hospital</h2>
            <form method="POST" action="/execute_operation">
                <input type="hidden" name="operation" value="q1">
                <button type="submit">Execute Hospital Expansion</button>
            </form>
        </div>

        <!-- Q2: Patient Insurance Details -->
        <div class="operation">
            <h2>Q2: Patient Insurance Details</h2>
            <form method="POST" action="/execute_operation">
                <input type="hidden" name="operation" value="q2">
                <button type="submit">Show Patient Insurance Details</button>
            </form>
        </div>

        <!-- Q3: Update Consultation -->
        <div class="operation">
            <h2>Q3: Update Consultation Follow-up</h2>
            <form method="POST" action="/execute_operation">
                <input type="hidden" name="operation" value="q3">
                <button type="submit">Update John Smith's Consultation</button>
            </form>
        </div>

        <!-- Q4: Delete Hospital Location -->
        <div class="operation">
            <h2>Q4: Delete Hospital Location</h2>
            <form method="POST" action="/execute_operation">
                <input type="hidden" name="operation" value="q4">
                <button type="submit">Delete Hospital Location</button>
            </form>
        </div>

        <!-- View Operations -->
        <div class="operation">
            <h2>View Operations</h2>
            <div class="view-buttons">
                <form method="POST" action="/execute_operation">
                    <input type="hidden" name="operation" value="qv1">
                    <button type="submit">QV1: Hospitals in Cityville</button>
                </form>
                <form method="POST" action="/execute_operation">
                    <input type="hidden" name="operation" value="qv2">
                    <button type="submit">QV2: Patients Over 30</button>
                </form>
                <form method="POST" action="/execute_operation">
                    <input type="hidden" name="operation" value="qv3">
                    <button type="submit">QV3: Physician with Most Specialties</button>
                </form>
                <form method="POST" action="/execute_operation">
                    <input type="hidden" name="operation" value="qv4">
                    <button type="submit">QV4: Average Patient Age</button>
                </form>
            </div>
        </div>

        <!-- Display Results -->
        <div id="result" class="result" style="display: none;">
            <h3>Operation Result:</h3>
            <pre id="result-content"></pre>
        </div>
    </div>

    <script>
        document.querySelectorAll('form').forEach(form => {
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const formData = new FormData(this);
                
                fetch('/execute_operation', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    const resultDiv = document.getElementById('result');
                    const resultContent = document.getElementById('result-content');
                    
                    resultContent.textContent = data.result;
                    resultDiv.style.display = 'block';
                    
                    resultDiv.scrollIntoView({ behavior: 'smooth' });
                })
                .catch(error => {
                    console.error('Error:', error);
                });
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Status | APC DataHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; color: white; overflow-x: hidden; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .header { text-align: center; margin-bottom: 30px; }
        .logo { display: flex; align-items: center; justify-content: center; gap: 15px; font-size: 2em; font-weight: 700; margin-bottom: 20px; }
        .logo a { color: white; text-decoration: none; }
        .content-card { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border-radius: 20px; padding: 30px; border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: 0 20px 40px rgba(0,0,0,0.1); margin-bottom: 30px; }
        h1 { font-size: 2.5em; margin-bottom: 10px; background: linear-gradient(45deg, #ff6b6b, #feca57); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .description { font-size: 1.2em; opacity: 0.9; margin-bottom: 30px; }
        .status-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin: 20px 0; }
        .status-card { background: rgba(255, 255, 255, 0.1); padding: 20px; border-radius: 10px; text-align: center; }
        .status-card.good { border-left: 4px solid #2ecc71; }
        .status-card.warning { border-left: 4px solid #f39c12; }
        .status-card.error { border-left: 4px solid #e74c3c; }
        .status-icon { font-size: 2em; margin-bottom: 10px; }
        .back-btn { background: rgba(255, 255, 255, 0.2); border: none; border-radius: 10px; padding: 10px 20px; color: white; text-decoration: none; display: inline-flex; align-items: center; gap: 10px; transition: all 0.3s ease; }
        .back-btn:hover { background: rgba(255, 255, 255, 0.3); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo"><a href="/"><i class="fas fa-database"></i>APC DataHub</a></div>
            <h1>Database Status</h1>
            <p class="description">Monitor your APC database connection and health</p>
        </div>

        <div class="content-card">
            <h2><i class="fas fa-heartbeat"></i> System Status</h2>
            
            <div class="status-grid">
                <div class="status-card good">
                    <div class="status-icon"><i class="fas fa-database"></i></div>
                    <h3>Database</h3>
                    <p>apc_database</p>
                    <p style="color: #2ecc71;">Connected</p>
                </div>
                
                <div class="status-card good">
                    <div class="status-icon"><i class="fas fa-server"></i></div>
                    <h3>Server</h3>
                    <p>localhost</p>
                    <p style="color: #2ecc71;">Online</p>
                </div>
                
                <div class="status-card good">
                    <div class="status-icon"><i class="fas fa-table"></i></div>
                    <h3>Tables</h3>
                    <p>9 Tables</p>
                    <p style="color: #2ecc71;">Ready</p>
                </div>
                
                <div class="status-card good">
                    <div class="status-icon"><i class="fas fa-eye"></i></div>
                    <h3>Views</h3>
                    <p>3 Views</p>
                    <p style="color: #2ecc71;">Active</p>
                </div>
            </div>

            <div style="text-align: center; margin-top: 30px;">
                <a href="/test_connection" class="back-btn">
                    <i class="fas fa-plug"></i> Test Connection
                </a>
            </div>
        </div>

        <a href="/" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
    </div>
</body>
</html>
